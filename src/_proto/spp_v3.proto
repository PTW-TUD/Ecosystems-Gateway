syntax = "proto3";

package eupg.ecosystemsgateway.v3;

import "google/protobuf/struct.proto";
import "google/api/annotations.proto";
import "protoc-gen-openapiv2/options/annotations.proto";

option go_package = "ecosystemsgateway/pb/v3";

option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_swagger) = {
    info: {
        title: "Ecosystem Gateway API";
        version: "3.0";
        description: "HTTP/JSON gateway for publishing, querying, and consuming ecosystem offerings.";
    };
    // Host intentionally omitted to allow same-origin usage from Swagger UI
    base_path: "/";
    schemes: HTTP; //add HTTPS in prod
    consumes: "application/json";
    produces: "application/json";
};

// Public gateway API for publishing, querying, and consuming offerings across supported ecosystems.
service ecosystemsgateway{
    // Publication endpoints
    rpc CreateOffering(CreateOfferingRequest) returns (CreateOfferingResponse){
        option (google.api.http) = {
            post: "/grpc/CreateOffering";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Create offering";
            description: "Publishes one or more offerings to Pontus-X and/or XFSC.";
            tags: "ecosystemsgateway";
        };
    }
    rpc UpdateOffering(UpdateOfferingRequest) returns (UpdateOfferingResponse){
        option (google.api.http) = {
            post: "/grpc/UpdateOffering";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Update offering";
            description: "Updates an existing offering in the target ecosystem.";
            tags: "ecosystemsgateway";
        };
    }
    rpc UpdateOfferingLifecycle(UpdateOfferingLifecycleRequest) returns (UpdateOfferingLifecycleResponse){
        option (google.api.http) = {
            post: "/grpc/UpdateOfferingLifecycle";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Update offering lifecycle";
            description: "Changes the lifecycle state of an existing offering.";
            tags: "ecosystemsgateway";
        };
    }

    // Consumer endpoints
    rpc GetOffering(GetOfferingRequest) returns (GetOfferingResponse) {
        option (google.api.http) = {
            post: "/grpc/GetOffering";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get offering";
            description: "Fetches one or more offerings by identifier or lookup criteria.";
            tags: "ecosystemsgateway";
        };
    }
    rpc QueryOfferings(QueryOfferingsRequest) returns (QueryOfferingsResponse) {
        option (google.api.http) = {
            post: "/grpc/QueryOfferings";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Query offerings";
            description: "Searches offerings in the selected ecosystem.";
            tags: "ecosystemsgateway";
        };
    }
    rpc AccessService(AccessServiceRequest) returns (AccessServiceResponse) {
        option (google.api.http) = {
            post: "/grpc/AccessService";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Access service";
            description: "Requests an access URL for a published service.";
            tags: "ecosystemsgateway";
        };
    }

    // Compute-to-data endpoints
    rpc RunComputeToDataJob(CreateComputeToDataRequest) returns (ComputeToDataResponse){
        option (google.api.http) = {
            post: "/grpc/RunComputeToDataJob";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Run compute-to-data job";
            description: "Starts a compute-to-data job for a published asset.";
            tags: "ecosystemsgateway";
        };
    }
    rpc GetComputeToDataStatus(ComputeToDataStatusRequest) returns (ComputeToDataStatusResponse){
        option (google.api.http) = {
            post: "/grpc/GetComputeToDataStatus";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get compute-to-data status";
            description: "Returns the current execution status of a compute-to-data job.";
            tags: "ecosystemsgateway";
        };
    }
    rpc GetComputeToDataResult(CreateComputeToDataResultRequest) returns (GetComputeToDataResultResponse){
        option (google.api.http) = {
            post: "/grpc/GetComputeToDataResult";
            body: "*";
        };
        option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_operation) = {
            summary: "Get compute-to-data result";
            description: "Returns the output of a completed compute-to-data job.";
            tags: "ecosystemsgateway";
        };
    }
}

// Request payload for publishing one or more offerings.
message CreateOfferingRequest {
    option (grpc.gateway.protoc_gen_openapiv2.options.openapiv2_schema) = {
        example: "{\"offerings\":[{\"pontusxOffering\":{\"metadata\":{\"type\":\"dataset\",\"name\":\"Machine data\",\"description\":\"Sensor data of a milling machine\",\"author\":\"PTW TU Darmstadt\",\"providedBy\":\"PTW TU Darmstadt\",\"license\":\"CC-BY-4.0\",\"tags\":[\"manufacturing\"],\"language\":\"en\",\"links\":{\"website\":\"https://www.ptw.tu-darmstadt.de\"}},\"additionalInformation\":{\"termsAndConditions\":true,\"gaiaXInformation\":{\"containsPII\":false,\"termsAndConditions\":[{\"url\":\"https://example.org/terms\"}],\"serviceSD\":{\"url\":\"https://example.org/service-offering.json\"}}},\"services\":[{\"name\":\"Download\",\"type\":\"access\",\"pricing\":{\"pricingType\":\"FIXED_EURAU\",\"price\":\"0.5\"},\"files\":[{\"url\":\"https://example.org/data.csv\",\"method\":\"GET\"}],\"timeout\":86400}],\"credentials\":{\"allow\":[],\"deny\":[]}}}]}"
    };

    message Offering {
        oneof EcosystemOffering {
            PontusxOffering pontusxOffering = 1;
            XfscOffering xfscOffering = 2;
        }
    }
    repeated Offering offerings = 1;
}

// Offering for the XFSC federated catalogue.
message XfscOffering {
    // Gaia-X compliant Verifiable Presentation of the service offering as JSON-LD.
    string vp = 1;
}

// Offering for Pontus-X, published as a DDO v5 asset.
message PontusxOffering {
    // The main information about the asset to publish
    Metadata metadata = 1;

    // Additional information regarding the offering
    // Exclusively used for terms & conditions and link to Gaia-X VPs
    AdditionalInformation additionalInformation = 2;

    // Services that are exposed by the asset to interact with it
    // Cardinality: 1..n -> At least one service has to be passed for publishing
    repeated Service services = 3;

    // Allowlist & Denylist of wallet addresses for the offering.
    // Without allow addresses everyone is allowed.
    optional CredentialLists credentials = 4;
}

// Response returned after creating offerings.
message CreateOfferingResponse {
    // List of identifier of the successfully published offering(s)
    // example: did:ope:123 in Pontus-X ecosystem
    repeated string id = 1;

    // Debug information
    google.protobuf.Struct debugInformation = 2;
}

// Request payload for updating already published offerings.
message UpdateOfferingRequest {
    message UpdateOffering {
        oneof EcosystemOffering {
            PontusxUpdateOffering pontusxUpdateOffering = 1;
            XfscUpdateOffering xfscUpdateOffering = 2;
        }

        // Optional information about the published asset
        // If this Information is set, it is used to publish the offering to the Credential Event Service
        optional PublishInfo publishInfo = 3;
    }
    repeated UpdateOffering offerings = 1;
}

// Update of an offering in the XFSC federated catalogue.
message XfscUpdateOffering {
    // Hash of the original Verifiable Presentation published to the catalogue.
    string hash = 1;

    // Updated Gaia-X compliant Verifiable Presentation of the service offering as JSON-LD.
    string vp = 2;
}

// Update of a published Pontus-X offering. Fields that are not given are kept.
message PontusxUpdateOffering {
    // Decentralised identifier for the already published offering
    // example: did:ope:1234
    string did = 1;

    // The main information about the asset
    optional Metadata metadata = 2;

    // Additional information regarding the offering
    // Exclusively used for terms & conditions and link to Gaia-X VPs
    optional AdditionalInformation additionalInformation = 3;

    // Updated Services that are exposed by the asset to interact with it
    message UpdateService {
        Service service = 1;

        // Optional index of the service of the asset that is to be updated according to the information in the service field above
        // If no index is given the first service [index = 0] is updated
        optional int32 index = 2;
    }
    repeated UpdateService updateServices = 4;

    // Allowlist & Denylist of wallet addresses for the offering. When given, these lists
    // replace the stored address lists; without allow addresses everyone is allowed.
    // When omitted, the stored lists are kept.
    optional CredentialLists credentials = 5;
}

// Supplemental data for publishing an offering update to the Credential Event Service.
message PublishInfo{
    // The source where to find the published offering
    // example: https://www.pontus-x.eu/asset/did:ope:ac74139fa102d32f326ccdab3727a95299f1c2b6add9158385439e5b06810833
    string source = 1;

    // The data that is submitted to the credential event service
    // At the moment: Has to be a (Compliance) VC issued by the Gaia-X compliance engine
    string data = 2;
}

// Response returned after updating offerings.
message UpdateOfferingResponse{
    // List of identifier of the successfully updated offering(s)
    // example: did:ope:123 in Pontus-X ecosystem
    repeated string id = 1;

    // Locations of the offering which where published to the Credential Event Service
    repeated string locations = 2;

    // Debug information
    google.protobuf.Struct debugInformation = 3;
}

// Request payload for changing the lifecycle state of an existing offering.
message UpdateOfferingLifecycleRequest {
    message UpdateOfferingLifecycle {
        oneof EcosystemOffering {
            PontusxUpdateOfferingLifecycle pontusxUpdateOfferingLifecycle = 1;
            XfscUpdateOfferingLifecycle xfscUpdateOfferingLifecycle = 2;
        }
    }
    repeated UpdateOfferingLifecycle offerings = 1;
}

// Lifecycle change of a Pontus-X offering.
message PontusxUpdateOfferingLifecycle {
    // Decentralised identifier for the already published offering
    // example: did:ope:1234
    string did = 1;

    // Pontus-X lifecycle state to which the offering should be changed
    PontusxLifecycleStates to = 2;
}

// Lifecycle change of an XFSC offering.
message XfscUpdateOfferingLifecycle {
    // String containing the hash of the original Verifiable Presentation published to the catalogue
    string hash = 1;

    // Possible lifecycle states of asset in the XFSC ecosystem
    enum XfscLifecycleStates{
        // Fully functional asset
        // Discoverable in Portal
        // Default value meaning nothing has to be changed
        ACTIVE = 0;

        // Publisher has explicitly revoked access or ownership rights to the asset
        // Asset will stay in the catalogue but an expiration date will be added
        REVOKED_BY_PUBLISHER = 3;

        // Asset will be completely deleted from the catalogue
        DELETED = 4;
    }

    // XFSC lifecycle state to which the offering should be changed
    XfscLifecycleStates to = 2;
}

// Response returned after changing lifecycle states.
message UpdateOfferingLifecycleResponse {
    // List of identifier of the successfully changed offering(s)
    // example: did:ope:123 in Pontus-X ecosystem
    repeated string id = 1;

    // Debug information
    google.protobuf.Struct debugInformation = 2;
}

// Request payload for retrieving offerings.
message GetOfferingRequest {
    message Offering {
        oneof EcosystemOffering {
            PontusxGetOffering pontusxOffering = 1;
            XfscGetOffering xfscOffering = 2;
        }
    }
    repeated Offering offerings = 1;
}

// Offerings found, each as a JSON document (a DDO v5 for Pontus-X).
message GetOfferingResponse {
    repeated string offerings = 1;

    // Debug information
    google.protobuf.Struct debugInformation = 2;
}

// Lookup of an offering in the XFSC federated catalogue.
message XfscGetOffering {
    string did = 1;
    string issuer = 2;
    string name = 3;
}

// Lookup of a Pontus-X offering.
message PontusxGetOffering {
    // example: did:ope:1234
    string did = 1;
}

// Request payload for searching offerings.
message QueryOfferingsRequest {
    message Query {
        oneof EcosystemQuery {
            PontusxQueryOfferings pontusxQuery = 1;
            XfscQueryOfferings xfscQuery = 2;
        }
    }
    Query query = 1;
}

// Offerings found, each as a JSON document (a DDO v5 for Pontus-X), and the total number of matches.
message QueryOfferingsResponse {
    repeated string offerings = 1;
    int32 total = 2;
}

// Search in the XFSC federated catalogue.
message XfscQueryOfferings {
    string did = 1;
    string issuer = 2;
    string name = 3;
}

// Search of Pontus-X offerings; all given criteria have to match.
message PontusxQueryOfferings {
    // Optional identifier of the offering.
    optional string did = 1;
    optional string name = 2;
    optional string description = 3;
    optional string author = 4;
    // 'dataset' or 'algorithm'
    optional string metadataType = 5;
    // 'access' or 'compute'
    optional string serviceType = 6;
    // Page to return, starting at 0 (the first page)
    // Defaults to the first page; pageSize defaults to 50
    optional int32 page = 7;
    optional int32 pageSize = 8;
}

// Request payload for retrieving a consumable access URL for a service.
message AccessServiceRequest {
    message Service {
        oneof EcosystemService {
            PontusxAccessService pontusxService = 1;
            XfscAccessService xfscService = 2;
        }
    }
    Service service = 1;
}

// Access to a service of a Pontus-X offering.
message PontusxAccessService {
    // example: did:ope:1234
    string did = 1;

    // Defaults to the first access service of the asset.
    optional string serviceId = 2;

    // Defaults to the first file in the selected service.
    optional int32 fileIndex = 3;

    // Values for the consumer parameters of the service.
    map<string, string> userdata = 4;
}

// Access to an XFSC offering.
message XfscAccessService {
    string vc = 1;
}

// Response returned with the access URL.
message AccessServiceResponse {
    // Identifier of the requested service offering
    // example: did:ope:123 in Pontus-X ecosystem
    string id = 1;

    // Download URL of the ocean-node
    string accessUrl = 2;
}

// Request payload for starting a compute-to-data job in Pontus-X.
message CreateComputeToDataRequest {
    // DID of the dataset
    string did = 1;

    // Compute service of the dataset; defaults to its first compute service
    optional string serviceId = 2;

    // Values for the consumer parameters of the dataset's compute service
    map<string, string> userdata = 3;

    // DID of the algorithm to run on the dataset
    string algorithm = 4;

    // Service of the algorithm; defaults to its compute service, else its first service
    optional string algorithmServiceId = 5;

    // Values for the consumer parameters of the algorithm's service
    map<string, string> algorithmUserdata = 6;

    // Values for the consumer parameters of the algorithm itself (Metadata.algorithm.consumerParameters)
    map<string, string> algorithmParameters = 7;

    // Compute environment of the ocean-node; defaults to the gateway's COMPUTE_ENV, else the node's first
    optional string computeEnv = 8;

    // Resources to request, e.g. cpu, ram (GB) and disk (GB), with ids as the environment lists them
    // Defaults to the environment's minimum of each, at least 1 cpu, ram and disk
    repeated ComputeResource resources = 9;

    // Maximum job duration in seconds; capped to the environment's limit
    optional uint32 maxJobDuration = 10;

    // Runs the job in the environment's free tier: nothing is ordered or paid, but the
    // environment has to offer one and its limits apply
    optional bool free = 11;
}

// A resource requested for a compute job.
message ComputeResource {
    // Resource id as the compute environment lists it, e.g. "cpu", "ram" or "disk"
    string id = 1;

    // Amount in the unit of the environment, e.g. cores or GB
    double amount = 2;
}

// Response returned after starting a compute-to-data job.
message ComputeToDataResponse {
    // ocean-node job ids in the form <environmentHash>-<jobId>
    repeated string jobId = 1;
}

// Request payload for the status of a compute-to-data job.
message ComputeToDataStatusRequest {
    // ocean-node job id in the form <environmentHash>-<jobId>
    string jobId = 1;
}

// Status of a compute-to-data job.
message ComputeToDataStatusResponse {
    // Compute-to-Data v2 status code of the ocean-node, e.g. 1 queued, 40 running algorithm,
    // 70 finished; a job that ends below 70 failed
    int32 status = 1;

    // Description of the status code
    string description = 2;
}

// How the result of a compute-to-data job is returned.
enum ComputeToDataResultType {
    // The result, base64 encoded, fetched and cached by the gateway once the job finished
    C2D_DATA = 0;

    // A download URL of the ocean-node for the result
    C2D_URI = 1;
}

// Request payload for retrieving compute-to-data job results.
// By default the job's output archive (outputs.tar) is returned; for C2D_URI, jobIndex selects another result file of the job.
message CreateComputeToDataResultRequest {
    // ocean-node job id in the form <environmentHash>-<jobId>
    string jobId = 1;

    ComputeToDataResultType computeToDataReturnType = 2;

    optional int32 jobIndex = 3;
}

// Processing state of a compute-to-data result.
enum ComputeToDataResponseState {
    QUEUED = 0;
    IN_PROGRESS = 1;
    FINISHED = 2;
}

// The result can either be a URL or a full data, see CreateComputeToDataResultRequest
message GetComputeToDataResultResponse {
    ComputeToDataResponseState state = 1;

    // The result, or for a result not yet fetched a status message
    string data = 2;
}

// Core asset metadata used for Pontus-X create and update operations.
// On an update, given values replace the stored ones; tags and categories are added to the stored ones.
message Metadata {
    // type of the asset
    // Can be either 'dataset' or 'algorithm'
    string type = 1;

    // Descriptive name or title of the asset
    // This information is displayed in the portal
    string name = 2;

    // Details of what the resource is. For a dataset, this attribute explains what the data represents and what it can be used for.
    // This information is displayed in the portal
    // Supports markdown
    string description = 3;

    // Name of the entity generating this data
    string author = 4;

    // Short name referencing the license of the asset
    // example: CC-BY-4.0, Public Domain
    string license = 5;

    // Optional keywords or tags used to describe the content of the offering
    repeated string tags = 6;

    // Information about asset of type algorithm
    // Only optional for dataset -> Non-optional for algorithm
    optional AlgorithmMetadata algorithm = 7;

    // Organisation that provides the asset (DDO v5 providedBy)
    // Defaults to the gateway's PROVIDED_BY, else the author
    optional string providedBy = 8;

    // Title to display instead of the name
    optional string displayTitle = 9;

    // Holder of the copyright of the asset
    optional string copyrightHolder = 10;

    // Language of the content, as a BCP 47 tag, e.g. "en" or "de"
    optional string language = 11;

    // Optional categories of the offering
    repeated string categories = 12;

    // Links to further information, as label and URL
    // example: {"website": "https://example.org"}
    map<string, string> links = 13;
}

// Metadata of an algorithm.
message AlgorithmMetadata {
    // Language used to implement the software, e.g. "python"
    optional string language = 1;

    // Version of the software preferably in SemVer notation, e.g. 1.0.0.
    optional string version = 2;

    // Optional consumer parameters of the algorithm
    // Their values are given with CreateComputeToDataRequest.algorithmParameters
    repeated ConsumerParameter consumerParameters = 3;

    // Information about the Docker image for running the algorithm
    Container container = 4;
}

// Docker image of an algorithm.
message Container {
    // The command to execute, or script to run inside the Docker image, e.g. "node $ALGO"
    // $ALGO is a macro that gets replaced inside the compute job, depending where your algorithm code is downloaded
    string entrypoint = 1;

    // The Docker image name the algorithm will run with
    // e.g. "node"
    string image = 2;

    // The Docker image tag that you are going to use
    // e.g. "latest"
    string tag = 3;

    // Digest of the Docker image (e.g: sha256:xxxx)
    string checksum = 4;
}

// Services define the access for an asset
message Service {
    optional string name = 1;

    optional string description = 2;

    // Type of service: access or compute
    string type = 3;

    // Information about the pricing model and amount for consumption
    Pricing pricing = 4;

    // Files that contain the data related to the asset/service
    // At least one file is required for publication
    repeated Files files = 5;

    // Describing how long the service can be used after consumption is initiated.
    // Expressed in seconds; where 0 represents no time limit
    // Defaults to 86400 (one day) when publishing; an update keeps the stored timeout unless one is given
    optional uint32 timeout = 6;

    // Name for the access token that is generated for consuming the asset/service
    // Important for following access token transactions in the explorer
    optional string tokenName = 7;

    // Corresponding Symbol (Abbreviation) for the access token that is generated for consuming the asset/service
    // Important for following access token transactions in the explorer
    optional string tokenSymbol = 8;

    // URL (schema + host) of the ocean-node that serves the service; its files are encrypted for this node
    // If no value is given the gateway's ocean-node (OCEAN_NODE_URI) is used
    // An update keeps the stored endpoint unless one is given, and can only change it together with the files
    optional string serviceEndpoint = 9;

    // Compute options for a compute asset/service
    // Only optional if the offering is of type 'access' and not 'compute'
    optional ComputeOptions computeOptions = 10;

    // Optional message that defines required consumer input before consuming the asset/service
    // On an update, the given parameters replace the stored ones; none given keeps them
    repeated ConsumerParameter consumerParameters = 11;
}

// Information about the price for the asset for consumption in the ecosystem
message Pricing {
    // The payment tokens a network offers: OP Sepolia FREE and FIXED_EURAU (devEURAU),
    // the Pontus-X networks all of them
    enum PricingType {
        FREE = 0;
        FIXED_OCEAN = 1;
        FIXED_EUROE = 2;
        FIXED_EURAU = 3;
    }

    // Definition if the asset is free or has to be payed with a fixed currency
    PricingType pricingType = 1;

    // The price in units of the currency (according to Pricing Type) as a decimal number, e.g. "0.5"
    // Defaults to the network's configured price of the pricing type
    optional string price = 2;
}

// Information about a file related to a offering used in Main
// At the moment only files that are accessible over a Static URL (HTTP) are accepted
// (possible alternatives: Arweave, GraphQL, IPFS, Smart Contract)
message Files{
    // File URL
    string url = 1;

    // HTTP Method used to access the file
    // example: 'GET'
    string method = 2;

    // Optional headers field e.g. for basic access control
    map<string, string> headers = 3;
}

// Which algorithms may run on a compute service.
// When publishing, a list that is not given trusts nobody; on an update, it keeps the stored one.
// Without trusted algorithms, trusted publishers and raw algorithms, no algorithm can run.
message ComputeOptions {
    // If true, any passed raw text will be allowed to run. Useful for an algorithm drag & drop use case, but increases risk of data escape through malicious user input.
    // Defaults to false when publishing; an update keeps the stored value unless one is given
    optional bool allowRawAlgorithm = 1;

    // If true, the algorithm job will have network access.
    // Defaults to false when publishing; an update keeps the stored value unless one is given
    optional bool allowNetworkAccess = 2;

    // Published algorithms the publisher allows to run on the service
    // When given, replaces the stored ones
    optional TrustedAlgorithms trustedAlgorithms = 3;

    // Publishers whose published algorithms may all run on the service
    // When given, replaces the stored ones
    optional TrustedPublishers trustedPublishers = 4;
}

// Published algorithms trusted to run on a compute service.
message TrustedAlgorithms {
    // Trusts every published algorithm; algorithms is ignored then
    bool all = 1;

    // The trusted algorithms; empty trusts none
    repeated TrustedAlgorithm algorithms = 2;
}

// A published algorithm trusted to run on a compute service.
// Its file and container checksums are read from its DDO and the ocean-node.
message TrustedAlgorithm {
    // Decentralised identifier of the already published algorithm
    // example: did:ope:456
    string did = 1;

    // Services of the algorithm that are trusted
    // Defaults to its compute service, else its first service
    repeated string serviceIds = 2;
}

// Publishers whose published algorithms are trusted to run on a compute service.
message TrustedPublishers {
    // Trusts the algorithms of every publisher; addresses is ignored then
    bool all = 1;

    // Wallet addresses (0x...) of the trusted publishers; empty trusts none
    repeated string addresses = 2;
}

// Additional Pontus-X specific metadata, primarily for Gaia-X related information.
message AdditionalInformation{
    // Boolean to indicate if the publisher specifies it's own terms and conditions for consumption of the asset
    bool termsAndConditions = 1;

    // Information in the context of Gaia-X compliance including the link to the Self-Description of the offering (VP)
    GaiaX gaiaXInformation = 2;
}

// Gaia-X related compliance information referenced by AdditionalInformation.
message GaiaX{
    // Identifier if the asset contains personally identifiable information
    bool containsPII = 1;

    // Terms and conditions additionally set by the publisher of the asset
    // Should only be passed if boolean in AdditionalInformation is true
    repeated Terms termsAndConditions = 2;

    // Endpoint to the Gaia-X compliant Self-Description (VP) of the offering
    message ServiceSelfDescription{
        // Static URL of the self-description
        string url = 1;

        // Optional identifier if the self-description has been verified against a Gaia-X Compliance Service
        // Mainly used by the deltaDAO portal
        optional bool isVerified = 2;
    }
    ServiceSelfDescription serviceSD = 3;
}

// Publisher-defined terms and conditions URL referenced by Gaia-X metadata.
message Terms{
    string url = 1;
}

// Additional input parameter that the asset needs before downloading or running a Compute-to-Data job at algorithm runtime
message ConsumerParameter {
    // The parameter name (this is sent as HTTP param or key towards algo)
    string name = 1;

    // The field type (text, number, boolean, select)
    string type = 2;

    // The field label which is displayed
    string label = 3;

    // Boolean which indicates if customer input for this field is mandatory
    bool required = 4;

    string description = 5;

    // The field default value. Has to match the transmitted type transmitted as string
    string default = 6;

    // For select types, a list of options as JSON objects containing a single key-value-pair
    // The key represents the option name, and the value is the option value
    // e.g. {"nodejs": "I love NodeJS"}
    repeated google.protobuf.Struct options = 7;
}

// Possible lifecycle states for an asset in the Pontus-X ecosystem.
enum PontusxLifecycleStates{
    // Fully functional asset
    // Discoverable in Portal and Ordering allowed
    // Listed under the owner's profile
    ACTIVE = 0;

    // This state indicates that the asset is usually deprecated or outdated
    // Discoverable, but not orderable
    // Not listed under the owner's profile
    END_OF_LIFE = 1;

    // This state indicates that another asset has deprecated the current asset
    // Not discoverable and not orderable
    // Not listed under the owner's profile
    DEPRECATED = 2;

    // Publisher has explicitly revoked access or ownership rights to the asset
    // Not discoverable and not orderable
    REVOKED_BY_PUBLISHER = 3;

    // Users can view the asset and gather information, but they cannot place orders at that moment
    // Discoverable, but not orderable
    // Listed under the owner's profile.
    ORDERING_DISABLED_TEMPORARILY = 4;

    // Not discoverable, but orderable
    // Listed under the owner's profile
    ASSET_UNLISTED = 5;
}

// Wallet address allowlist and denylist for Pontus-X, checked by the ocean-node or its
// policy server before anything is ordered or paid.
message CredentialLists {
    // Addresses allowed to access the offering; empty or "*" allows everyone
    repeated string allow = 1;

    // Addresses denied access to the offering
    repeated string deny = 2;
}
