name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches:
      - '**'

# grant the token permission to publish packages
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test
      - run: npm run test:e2e

  proto:
    name: 🧬 Proto
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run proto:lint
      - name: Check for breaking API changes against main
        run: |
          git rev-parse --verify --quiet main >/dev/null || git branch main origin/main
          # A new API version (a proto file main does not have yet) has nothing to compare with.
          new=$(for file in src/_proto/*.proto; do git cat-file -e "main:$file" 2>/dev/null || echo "$file"; done)
          if [ -n "$new" ]; then
            echo "::notice::Not on main yet, so not checked for breaking changes: $new"
          else
            npm run proto:breaking
          fi
      - name: Check that the generated code is current
        run: |
          npm run proto:gen
          generated="src/generated src/openapi src/_proto_runtime"
          if [ -n "$(git status --porcelain -- $generated)" ]; then
            git status --short -- $generated
            git diff -- $generated
            echo "::error::Generated proto output is out of date: run npm run proto:gen and commit the result"
            exit 1
          fi

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: [test, proto]
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Upload `dist/` artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/**
          retention-days: 90

  docker-build:
    name: 🐋 Docker Build & Push
    runs-on: ubuntu-latest
    needs: [test, proto]
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase repo name
        run: echo "LOWER_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_REPO }}:${{ github.ref_name }}
            ghcr.io/${{ env.LOWER_REPO }}:R${{ github.run_number }}

  docker-build-dev:
    name: 🐋 Docker Build & Push (dev branches)
    runs-on: ubuntu-latest
    needs: [test, proto]
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase repo name
        run: echo "LOWER_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # make the tag safe if your branch contains slashes
      - name: Compute dev tag
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          echo "DEV_TAG=dev-${SAFE_REF}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_REPO }}:${{ env.DEV_TAG }}
