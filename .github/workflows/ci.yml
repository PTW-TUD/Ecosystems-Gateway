name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches:
      - '**'

# grant the token permission to publish packages
permissions:
  contents: read
  packages: write

jobs:
  test:
    name: 🧪 Test
    runs-on: ubuntu-latest
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run test
      - run: npm run test:e2e -- --runInBand

  build:
    name: 📦 Build
    runs-on: ubuntu-latest
    needs: test
    container:
      image: node:22-alpine
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
      - run: npm ci
      - run: npm run build
      - name: Upload `dist/` artifact
        uses: actions/upload-artifact@v6
        with:
          name: dist
          path: dist/**
          retention-days: 90

  docker-build:
    name: 🐋 Docker Build & Push
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/')) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase repo name
        run: echo "LOWER_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_REPO }}:${{ github.ref_name }}
            ghcr.io/${{ env.LOWER_REPO }}:R${{ github.run_number }}

  docker-build-dev:
    name: 🐋 Docker Build & Push (dev branches)
    runs-on: ubuntu-latest
    needs: test
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/main' }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set lowercase repo name
        run: echo "LOWER_REPO=${GITHUB_REPOSITORY,,}" >> $GITHUB_ENV

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # make the tag safe if your branch contains slashes
      - name: Compute dev tag
        run: |
          SAFE_REF="${GITHUB_REF_NAME//\//-}"
          echo "DEV_TAG=dev-${SAFE_REF}" >> $GITHUB_ENV

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.LOWER_REPO }}:${{ env.DEV_TAG }}
