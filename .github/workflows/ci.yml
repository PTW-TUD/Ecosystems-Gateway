name: CI

on:
  push:
    branches:
      - '**'
    tags:
      - '*'
  pull_request:
    branches:
      - '**'

# A newer push to the same branch or PR supersedes the running checks; main and tags always finish so every image gets built.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/') }}

permissions:
  contents: read

jobs:
  test:
    name: 🧪 Test
    # Branches of this repo are already checked by their push run, so pull requests only run for forks.
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test
      - run: npm run test:e2e

  proto:
    name: 🧬 Proto
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run proto:lint
      - name: Check for breaking API changes against main
        run: |
          git rev-parse --verify --quiet main >/dev/null || git branch main origin/main
          # A new API version (a proto file main does not have yet) has nothing to compare with.
          new=$(for file in src/_proto/*.proto; do git cat-file -e "main:$file" 2>/dev/null || echo "$file"; done)
          if [ -n "$new" ]; then
            echo "::notice::Not on main yet, so not checked for breaking changes: $new"
          else
            npm run proto:breaking
          fi
      - name: Check that the generated code is current
        run: |
          npm run proto:gen
          generated="src/generated src/openapi src/_proto_runtime"
          if [ -n "$(git status --porcelain -- $generated)" ]; then
            git status --short -- $generated
            git diff -- $generated
            echo "::error::Generated proto output is out of date: run npm run proto:gen and commit the result"
            exit 1
          fi

  build:
    name: 📦 Build
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name != github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
      - name: Use Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Upload `dist/` artifact
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/**
          retention-days: 90

  docker:
    name: 🐋 Docker Build & Push
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: [test, proto, build]
    if: github.event_name == 'push'
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      # main and tags get their ref name and R<run number>; other branches get dev-<branch> (slashes replaced).
      - name: Compute image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=ref,event=tag
            type=raw,value=main,enable=${{ github.ref == 'refs/heads/main' }}
            type=ref,event=branch,prefix=dev-,enable=${{ github.ref != 'refs/heads/main' }}
            type=raw,value=R${{ github.run_number }},enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/') }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
