services:
  so-gateway:
    build:
      context: .
    container_name: so-gateway-1
    restart: unless-stopped
    environment:
      - PRIVATE_KEY=0x... # Create your own via https://gchq.github.io/CyberChef/#recipe=Generate_ECDSA_Key_Pair('P-256','DER')
      - NETWORK=OPSEPOLIA
      - NESTJS_LOG_LEVELS=log,warn,debug
      - NAUTILUS_LOG_LEVEL=debug
      - ENABLE_GRPC_GATEWAY=true
      - REDIS_ADDRESS=redis-pub:6379
      - OCEAN_NODE_URI=https://node.demo.pontus-x.eu # an OceanProtocolEnterprise ocean-node 4.2.x
      - DDO_STORE=ipfs # needed to create and update offerings, see .env.example
      - IPFS_UPLOAD_URL=https://api.pinata.cloud/pinning/pinFileToIPFS
      - IPFS_JWT=xxx
      - IPFS_GATEWAY_URL=https://gateway.pinata.cloud
    ports:
      - '5002:5002'
      - '3000:3000'
    labels:
      traefik.enable: true
      traefik.docker.network: proxy

      # https redirect
      traefik.http.routers.publishingconnector.rule: Host(`publishing-connector.localhost`)
      traefik.http.routers.publishingconnector.entrypoints: web
      traefik.http.routers.publishingconnector.middlewares: https-redirectscheme@file

      traefik.http.routers.publishingconnector-secure.rule: Host(`publishing-connector.localhost`)
      traefik.http.routers.publishingconnector-secure.entrypoints: websecure
      traefik.http.services.publishingconnector-secure.loadbalancer.server.port: 5001
  redis:
    image: 'docker.dragonflydb.io/dragonflydb/dragonfly'
    container_name: redis-pub
    ulimits:
      memlock: -1
    ports:
      - '6379:6379'

  redis-commander:
    image: rediscommander/redis-commander:latest
    hostname: redis-commander
    restart: unless-stopped
    environment:
      - REDIS_HOSTS=local:redis:6379
    ports:
      - '8081:8081'
